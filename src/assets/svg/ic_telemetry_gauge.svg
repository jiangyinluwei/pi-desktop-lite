<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- 手绘 3 点微刻度线 (精密仪器草图感) -->
  <line x1="12" y1="1" x2="12" y2="2.2" stroke-width="1.1" opacity="0.5" />
  <line x1="2.4" y1="8" x2="3.4" y2="8.6" stroke-width="0.9" opacity="0.4" />
  <line x1="21.6" y1="8" x2="20.6" y2="8.6" stroke-width="0.9" opacity="0.4" />

  <!-- 1. 外同心环：当前上下文消耗比例 (开度 240°，底轨半透明 + 激活进度弧) -->
  <path d="M4.0 16.6 A9.2 9.2 0 1 1 20.0 16.6" stroke-width="1.7" opacity="0.28" />
  <!-- 示意当前上下文消耗比例（约 55% 弧长，从左下顺时针扫至顶部略偏右） -->
  <path d="M4.0 16.6 A9.2 9.2 0 0 1 14.5 3.1" stroke-width="1.8" />

  <!-- 2. 内同心环：已消耗 Token 比例 (同心开度 240°，底轨半透明 + 激活进度弧) -->
  <path d="M6.1 15.4 A6.8 6.8 0 1 1 17.9 15.4" stroke-width="1.3" opacity="0.22" />
  <!-- 示意已消耗 Token 比例（约 38% 弧长，从左下顺时针扫至左上方） -->
  <path d="M6.1 15.4 A6.8 6.8 0 0 1 8.2 6.1" stroke-width="1.4" opacity="0.85" />

  <!-- 3. 中心手绘速度闪电火花 (直观展示实时生成速率活力) -->
  <path d="M12.3 7.2 L9.8 11.2 L11.8 11.2 L11.2 16.5 L14.2 11.8 L12.2 11.8 Z" fill="currentColor" stroke="none" />
</svg>
